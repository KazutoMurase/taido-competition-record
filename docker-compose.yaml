services:
  app:
    image: "ghcr.io/kazutomurase/taido-competition-record:latest"
    env_file:
      - .env
    ports:
      - ${PORT}:${PORT}
    volumes:
      - "./:/ws"
      # Keep image dependencies and build output separate from host files.
      - /ws/node_modules
      - /ws/.next
    command: /ws/tools/setup.bash ${COMPETITION_NAME}
